<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Бенедикт — аттестация администраторов</title>
<style>
:root{--bg:#F8F6F0;--card:#fff;--ink:#000;--mute:#615C5A;--line:#E8E6DE;--acc:#BC5A40;--acc2:#F3E4DE;--soft:#ECEAE4;--olive:#EEF0E2;--bad:#B3261E;--bad2:#F8E3E0;--ok:#4D6B3C;--ok2:#EEF0E2;--warn:#8A6A1F;--warn2:#F5EEDC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 TildaSans,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1100px;margin:0 auto;padding:16px}
.hero{background:#000;color:#fff;border-radius:20px;padding:20px 20px 40px}
.nav{background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:#000;border-radius:8px;padding:8px 18px;color:#fff;line-height:1;text-align:center}
.logo b{display:block;font-weight:300;font-size:20px;letter-spacing:.12em}
.logo small{display:block;font-size:7px;letter-spacing:.9em;margin-top:3px;padding-left:.9em}
.nav .lbl{color:#000;font-size:15px}
.hero h1{font-weight:400;font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.01em;margin:56px 0 12px}
.hero .sub{color:rgba(255,255,255,.75);margin:0;max-width:600px}
.wrap{max-width:820px;margin:0 auto;padding:28px 0 80px}
h2{font-weight:400;font-size:26px;letter-spacing:-.01em;margin:28px 0 10px}
h3{font-weight:400;font-size:20px;margin:24px 0 8px}
.card{background:var(--card);border-radius:16px;padding:22px;margin:12px 0}
.btn{appearance:none;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:13px 20px;font:inherit;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:#000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid transparent;border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line)}
.opt input{margin-top:4px;accent-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.q{font-size:17px;margin-bottom:8px}
.tag{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:var(--soft);color:#000}
.tag.bad{background:var(--bad2);color:var(--bad)}
.tag.ok{background:var(--ok2);color:var(--ok)}
.tag.warn{background:var(--warn2);color:var(--warn)}
textarea,input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:80px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--acc)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.steps button{border:0;background:var(--soft);color:#000;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.steps button.on{background:#000;color:#fff}
.steps button.done{background:var(--olive)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:400}
.mute{color:var(--mute)}
.small{font-size:14px}
.expl{font-size:14px;color:var(--mute);margin-top:8px}
.res-wrong{border-left:3px solid var(--acc)}
.notice{background:var(--olive);color:#000;border-radius:10px;padding:12px 14px;font-size:14px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{border:0;background:var(--soft);color:#000;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.hide{display:none}
ul{padding-left:20px}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.values div{background:var(--bg);border-radius:12px;padding:14px}
.values b{display:block;font-weight:400;font-size:17px;margin-bottom:4px}
.levels td:first-child{width:38%}
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <div class="nav">
      <div class="logo"><b>BENEDICT</b><small>КЛИНИКА</small></div>
      <span class="lbl">Аттестация администраторов</span>
      <div class="tabs hide" id="tabs">
        <button data-v="test" class="on">Пройти тест</button>
        <button data-v="mgr">Результаты команды</button>
      </div>
    </div>
    <h1>Когда за вашим врачом<br>стоит команда</h1>
    <p class="sub">Аттестация администраторов по скрипту v2 и стандарту общения с пациентом.</p>
  </div>
  <div class="wrap"><div id="app"></div></div>
</div>
<script>
const MODE = "offline"; // web | offline

// ---------- ЦЕННОСТИ ----------
const VALUES = [
 ["Безопасность пациента","Сначала — риск и срочность, потом — запись и цена. Сигнал опасности всегда передаётся врачу голосом и с подтверждением."],
 ["Доказательная медицина","Лечение опирается на научные данные и клинические рекомендации. Администратор не ставит диагнозов и не обещает результат."],
 ["Команда, а не один врач","Пациент не остаётся один на один с возможностями одного специалиста: при необходимости врач привлекает коллег внутри клиники."],
 ["Ответственность","Каждый отвечает за свою часть помощи. Обещанный срок соблюдается, задача фиксируется, передача замыкается."],
 ["Уважение и конфиденциальность","Внимание к предпочтениям, ценностям и жизненному контексту пациента. Врачебная тайна — для родственников и работодателя тоже."],
 ["Преемственность","Лечение не прерывается: рецепты, препараты, отмены и переносы — под контролем, пациент знает следующий шаг."]
];


const STAGES = [
 ["Приветствие и начало контакта","«Клиника Бенедикт, администратор [имя]. Здравствуйте! Как я могу к вам обращаться и чем могу помочь?»","Дать человеку первым сформулировать причину обращения. Не начинать с анкеты, не перебивать."],
 ["Понимание запроса","«Правильно я понимаю, что вы хотели бы [потребность]?» · «Чтобы подобрать подходящего специалиста, разрешите уточнить несколько моментов». По необходимости: кому нужна помощь, сколько полных лет, впервые или уже наблюдаетесь, нужен определённый врач или помочь с выбором, что сейчас важнее всего. Обязательно: «Как давно это продолжается и насколько мешает в обычной жизни — работе, сну, делам?» Если пациент уже на лечении: «Не заканчиваются ли препараты или рецепт до приёма?»","Определить потребность и тяжесть, а не диагноз. При признаках угрозы или тяжёлых симптомах — обычный сценарий прекращается, применяется стоп-блок. Если препараты заканчиваются — сегодня же передать лечащему врачу с подтверждением и сроком."],
 ["Эмоциональный контакт","«Понимаю, что эта ситуация вас беспокоит» · «Представляю, насколько непросто бывает решиться на первое обращение» · «Понимаю, что для вас важно попасть к специалисту как можно раньше».","Человека услышали, запрос не обесценили. Не говорить: «Не переживайте», «Всё будет хорошо», «Мы точно вам поможем»."],
 ["Подбор и представление специалиста","«С учётом того, что вы рассказали, могу предложить [врач]. [Врач] работает с [направление]. На консультации врач сможет подробнее разобраться в вашей ситуации». Аргументы клиники: команда, 23 врача из топ-100 Москвы, известный психофармаколог Сергей Сергеевич Потанин.","Объяснить, почему этот врач: 2–3 проверенных факта. Не обещать результат и диагноз за один приём."],
 ["Стоимость, формат и запись","«Первичная консультация длится [время] и стоит [цена из МИС]» · «Могу предложить [день, время] или [день, время]. Какой вариант удобнее?» · Если врач недоступен — лист ожидания или другой специалист с тем же профилем.","Предложить понятное действие. Не отправлять на сайт или агрегатор, если можно записать по телефону."],
 ["Если пациент сомневается","«Конечно, вы можете спокойно принять решение. Могу прислать информацию о специалисте, стоимость и доступное время». С согласия — предварительная бронь или договорённость о связи. При отказе: «Хорошо, конечно. Если решите обратиться, будем рады вам помочь».","Оставить выбор и доброжелательный контакт. Без давления и искусственного дефицита."],
 ["Подтверждение и завершение","«[Имя], подтверждаю: вы записаны к [врач] на [дата] в [время]. Продолжительность — [мин], стоимость — [сумма]». Адрес, подготовка, порядок оформления, канал связи. Тактично узнать, откуда пациент узнал о клинике. Если вопрос передан: «Свяжусь с вами до [срок]».","Человек точно знает, что будет дальше, кто отвечает и когда ждать связь. Всё фиксируется в CRM."]
];
const RULES = [
 "Не диагностируем, не корректируем лечение, не оцениваем заключения других врачей.",
 "При признаках клинической опасности — стоп-блок. При непосредственной угрозе — экстренная помощь, без ожидания записи.",
 "Сведения о пациенте третьим лицам не раскрываем. Сообщения родственников принимаем.",
 "Цены, возраст, длительность и доступность врача — только по актуальной системе клиники.",
 "У каждой договорённости о перезвоне и передаче есть ответственный, срок и подтверждение.",
 "Вопросы пациента важнее механического следования скрипту. Время сложного разговора не ограничиваем.",
 "Каждый звонок заканчивается ясным результатом: запись, согласованный контакт, передача ответственному или уважительно принятый отказ."
];

// ---------- ВОПРОСЫ ----------
const PARTS = [
 {id:"p1", short:"Стоп-блок", title:"Часть 1. Стоп-блок", note:"Порог — все ответы верны. Одна ошибка — пересдача части через 3 дня.", type:"mcq", qs:[
  {id:"1.1", t:"Мама 18-летней пациентки: «У неё сильная тревога, постоянно паники, и ощущение, что всё бессмысленно и ничего не поможет». Ваше первое действие?", o:{"а":"Успокоить: «Это похоже на паническое расстройство, с ним хорошо работают»","б":"Задать прямой вопрос: бывают ли у дочери мысли не жить или причинить себе вред","в":"Предложить самого доступного врача и ближайшую дату","г":"Попросить, чтобы дочь позвонила сама"}, k:"б", e:"«Всё бессмысленно, ничего не поможет» — безнадёжность, сигнал стоп-блока. Вариант «а» — диагноз от администратора."},
  {id:"1.2", t:"Пациент: «У меня нет сил, я уже вторую неделю лежу, не вставая». На вопрос о мыслях не жить отвечает «нет». Что дальше?", o:{"а":"Маршрут В: обычная запись, раз ответ «нет»","б":"Предложить записаться через сайт в удобное время","в":"Маршрут Б: тяжёлые симптомы — передать дежурному врачу, несмотря на ответ «нет»","г":"Внести в лист ожидания к желаемому врачу"}, k:"в", e:"Две недели в постели — тяжёлый симптом. Ответ «нет» не переводит в маршрут В."},
  {id:"1.3", t:"Ассистент пациента: «Ночью из-за смены дозировки было очень высокое давление, вызывали скорую. Передайте врачу, чтобы прочитал сообщение». Верный порядок?", o:{"а":"Спросить, как пациент прямо сейчас. Если сейчас боль в груди, сильная головная боль, спутанность, нарушение речи или давление снова высокое — 103 немедленно. Если стабилен — позвонить врачу голосом, получить подтверждение, назвать срок связи, записать в журнал и предупредить: при ухудшении — сразу 103","б":"«Хорошо, передам, он оперативно зайдёт в телеграм»","в":"Предложить приём сегодня в 16:00 и закончить разговор","г":"Посоветовать вернуться к прежней дозе до связи с врачом"}, k:"а", e:"Сначала — текущее состояние: при признаках опасности сейчас 103 вызывается немедленно, а не «при повторе». Вариант «г» — совет по лечению, критическое нарушение."},
  {id:"1.4", t:"Сестра пациента: «Мания держится, дозу снизили, а он почти не спит. Когда он у вас был?» Ваш ответ?", o:{"а":"Назвать дату визита и пообещать спросить врача","б":"Объяснить, что приём врача дорогой и первый был исключением","в":"Попросить, чтобы брат сам написал врачу","г":"Не подтверждать факт лечения, принять информацию и сегодня же передать врачу как срочную; при опасном поведении — 103"}, k:"г", e:"Врачебная тайна и срочность одновременно: информацию принимаем, сведения о пациенте не сообщаем."},
  {id:"1.5", t:"Женщина: «Муж выпил много таблеток, сейчас очень сонный. Можно записаться к врачу на завтра?»", o:{"а":"Записать на завтра на первое время","б":"Маршрут А: просить немедленно вызвать 103, уточнить адрес, остаться на линии, потом сообщить дежурному врачу","в":"Передать дежурному врачу и попросить дождаться его звонка","г":"Посоветовать дать мужу воды и уложить спать"}, k:"б", e:"Передозировка и сонливость — непосредственная угроза, маршрут А. Вариант «в» теряет время."},
  {id:"1.6", t:"Пациентка хочет к неврологу: «Час назад онемела правая рука и заплетается язык. Есть время завтра?»", o:{"а":"Маршрут А: сразу 103, не ждать свободного времени у невролога","б":"Записать к Куваеву на ближайшее время","в":"Передать вопрос дежурному врачу и перезвонить через 15 минут","г":"Предложить онлайн-консультацию сегодня вечером"}, k:"а", e:"Внезапная слабость руки и нарушение речи — признаки инсульта, счёт на часы."},
  {id:"1.7", t:"Маршрут Б (тяжёлые симптомы без непосредственной угрозы). Вы позвонили первому врачу цепочки, он не отвечает. Когда звоните Цверкову С. П.?", o:{"а":"Через 30 минут","б":"Когда у первого врача закончится приём","в":"Через 10 минут без ответа или сразу, если все врачи цепочки на приёме","г":"Только если пациент позвонит повторно"}, k:"в", e:"Цепочка для маршрута Б: 10 минут без ответа или сразу, если все заняты. Если угроза непосредственная (маршрут А) — цепочку не ждём: сначала 103."},
  {id:"1.8", t:"Вы написали врачу в мессенджер о красном флаге. Сообщение прочитано, ответа нет. Передача состоялась?", o:{"а":"Да, сообщение прочитано","б":"Нет: нужен звонок голосом и подтверждение «принял, свяжусь до…»","в":"Да, если прошло больше 10 минут","г":"Да, если сообщение отправлено в общий чат врачей"}, k:"б", e:"Сообщение без подтверждения не считается передачей: ответственность остаётся у администратора."},
  {id:"1.9", t:"Женщина о взрослом мужчине с игровой зависимостью: «Он очень подавлен, всякие мысли, думает про свою никчёмную жизнь. А врач женщина или мужчина?» Что делаете первым?", o:{"а":"Отвечаете на вопрос про пол врача","б":"Рассказываете о команде клиники и доказательном подходе","в":"Предлагаете ей посоветоваться с ним и перезвонить","г":"Задаёте вопрос о безопасности про него: говорил ли он о том, чтобы не жить или причинить себе вред"}, k:"г", e:"«Никчёмная жизнь» + подавленность — сначала безопасность. Презентация клиники — позже."},
  {id:"1.10", t:"Что НЕ должно быть в блоке «A — что сказано» карты передачи врачу?", o:{"а":"Дословные слова звонящего","б":"Ответ на вопрос о безопасности","в":"Предположение администратора о диагнозе","г":"То, что уже сделано (например, вызывали скорую)"}, k:"в", e:"В карте только факты и дословные слова; диагноз — дело врача."},
  {id:"1.11", t:"Пациентка на лечении: «Таблетки заканчиваются, до приёма не хватает. Ближайшее время у моего врача — через две недели». Ваши действия?", o:{"а":"Записать через две недели: раньше мест нет","б":"Посоветовать пить через день, чтобы растянуть","в":"Уточнить, на сколько дней осталось препарата и как самочувствие; сегодня же передать лечащему врачу как срочное — голосом или задачей с подтверждением; назвать пациентке срок ответа; не давать советов по приёму","г":"Предложить купить препарат в аптеке без рецепта"}, k:"в", e:"Обрыв терапии опасен синдромом отмены и рецидивом. Решение о рецепте и сроках — за врачом; задача администратора — не допустить, чтобы пациент остался без препарата из-за расписания. Образец риска — реальные звонки от 16.10."}
 ]},
 {id:"p2", short:"Ошибка в реплике", title:"Часть 2. Найдите ошибку в реплике", note:"Для каждой реплики напишите: что не так и как сказать правильно. Проверяет тренер.", type:"free", qs:[
  {id:"2.1", t:"Мама говорит, что у сына нет сил. Администратор: «Это же может быть не только депрессия. Это может быть биполярное расстройство… дефицит определённых гормонов».", k:"Диагнозы от администратора. Правильно: «Упадок сил бывает по разным причинам, именно для этого нужен приём. Записываю?» (+ вопрос о безопасности, если сил нет давно)."},
  {id:"2.2", t:"Мама рассказывает, что невролог сказал «всё само пройдёт». Администратор: «Сейчас диагноз является ошибочным. Вы правильно сделали, что записались именно к психиатру».", k:"Оценка чужого заключения. Правильно: «Понимаю, как это неприятно. Врач посмотрит всё заново, возьмите предыдущие заключения»."},
  {id:"2.3", t:"«А вообще вылечиваются?» — «В основном у нас положительная динамика… вполне могут выздороветь за не слишком долгий срок».", k:"Обещание результата. Правильно: «Прогноз обсудит врач после первой встречи. Задача первого приёма — понятный план»."},
  {id:"2.4", t:"«Можно записаться через ПроДокторов. Там выйдет много дешевле».", k:"Сам отправляет в агрегатор. Правильно: «Давайте я запишу вас сейчас»; цена — из МИС."},
  {id:"2.5", t:"Пациентка хочет к конкретному врачу. «[Врач] немножко начинает отходить от дел… удачно вышла замуж… в целом не хочет уже работать».", k:"Личная жизнь врача. Правильно: «У [врача] ограниченное расписание. Вношу в лист ожидания; если не терпит — предложу коллегу из нашей команды»."},
  {id:"2.6", t:"Пациентке отменили приём. «Давайте я вам в течение пяти минут перезвоню и сообщу информацию» (перезвона не было час).", k:"Неконтролируемый срок без задачи. Правильно: «Перезвоню до [время], даже если ответа ещё не будет» + задача в CRM."},
  {id:"2.7", t:"«Мы с вами подписываем отказ от передачи данных, и вся информация остаётся только в нашей базе, никуда не передаётся».", k:"Обещание, которое клиника может не выполнить. Правильно: фраза про конфиденциальность из скрипта (врачебная тайна; без согласия не сообщаем родственникам и работодателю; анонимный формат — расскажу условия)."},
  {id:"2.8", t:"Пациент: «Я подумаю, хорошо». Администратор: «Да, хорошо, конечно, будем ждать вашего звонка. До свидания».", k:"Нет следующего шага. Правильно: предложить с согласия предварительную бронь или сообщение в мессенджер с профилем врача; если отказывается — принять без давления."},
  {id:"2.9", t:"«У нас 23 врача из топ-100 Москвы, так что вас точно вылечат, гарантирую».", k:"Сильный аргумент превращён в обещание результата. Правильно: «В нашей команде 23 врача из топ-100 Москвы. Врач разберётся в вашей ситуации, а если понадобится, привлечёт коллег» — без гарантий исхода."}
 ]},
 {id:"p3", short:"Врач и цена", title:"Часть 3. Подбор врача и цена", note:"Цену всегда называем из МИС на момент звонка, не по памяти.", type:"mcq", qs:[
  {id:"3.1", t:"Ребёнок 6 лет, первичный приём. У Борисычева нет мест в ближайший месяц. Кого предложить?", o:{"а":"Лебедеву З. В.","б":"Мельникову А. Н.","в":"Куваеву (Бердыеву) Г. А. или Ставцева Н. А.","г":"Джабарову И. М."}, k:"в", e:"Куваева (Бердыева) принимает с 2 лет, Ставцев — с 3. Лебедева — с 15, Мельникова — с 12, Джабарова — с 17. Возрастные границы сверяйте со справочником врачей."},
  {id:"3.2", t:"Пациент спрашивает стоимость первичного приёма у конкретного врача. Откуда берёте цену?", o:{"а":"Из МИС на момент звонка","б":"По памяти — цены редко меняются","в":"С сайта агрегатора, там всегда актуально","г":"Спрашиваю у коллеги в чате и называю, что ответят"}, k:"а", e:"Единственный источник цены — МИС. Ошибки в цене из реальных звонков возникали, когда цену называли по памяти."},
  {id:"3.3", t:"В МИС цена выше той, что пациент видел на сайте. Ваш ответ?", o:{"а":"Назвать цену с сайта, чтобы не потерять пациента","б":"«Сайт неправильный, не смотрите туда»","в":"Назвать цену из МИС, спокойно пояснить, что цены обновляются; при сомнении уточнить у старшего администратора и перезвонить в названный срок","г":"Посоветовать записаться через агрегатор"}, k:"в", e:"Прозрачность: называем действующую цену, не спорим с пациентом и не критикуем источники; расхождение передаём старшему для исправления сайта."},
  {id:"3.4", t:"Подросток 16 лет, проблемы с алкоголем. К кому из наркологов можно записать?", o:{"а":"Агинян М. Э.","б":"Джабарова И. М.","в":"Ёжиков А. Ю.","г":"Комаров С. Д. или Барна И. В."}, k:"г", e:"Агинян — только взрослые, Джабарова — с 17, Ёжиков — психолог с 18. Комаров — с 16, Барна — подростки 15–17."},
  {id:"3.5", t:"«Мой психолог посоветовал прийти к вам на диагностику». Куда записываем?", o:{"а":"К врачу-психиатру на первичный приём","б":"К любому свободному психологу","в":"Только к главному эксперту","г":"Предлагаем выбрать на сайте"}, k:"а", e:"Диагностику проводит врач. Отправлять на сайт — терять пациента."},
  {id:"3.6", t:"Что обязательно входит в ответ о стоимости приёма?", o:{"а":"Только сумма","б":"Сумма, длительность, первичный или повторный приём, формат (очно или онлайн)","в":"Сумма и скидка, если пациент сомневается","г":"Сумма и сравнение с другими клиниками"}, k:"б", e:"Пациент должен понимать, за что платит. Скидки «для удержания» и сравнение с конкурентами — не инструменты администратора."}
 ]},
 {id:"p4", short:"Конфиденциальность", title:"Часть 4. Конфиденциальность, дети и подростки", note:"Возрастные правила и анонимность — на проверке у юриста. Вопрос 4.5 учебный и в зачёт не идёт.", type:"mcq", qs:[
  {id:"4.1", t:"Подросток 15 лет хочет прийти без родителей. Какой ответ верный?", o:{"а":"«До 18 лет — только с родителями»","б":"«Можно, если родитель устно разрешит по телефону»","в":"«Можно, и мы гарантируем, что родители ничего не узнают»","г":"«С 15 лет вы можете сами подписать согласие на приём психиатра или психотерапевта, нужен паспорт. Если речь о наркологической помощи — самостоятельно с 16 лет. Расскажите, к какому специалисту вы хотите?»"}, k:"г", e:"Возрастной порог зависит от вида помощи: для наркологии он выше. Гарантировать тайну от родителей до заключения юриста нельзя."},
  {id:"4.2", t:"Ребёнок 13 лет. Что нужно для приёма?", o:{"а":"Законный представитель на приёме, свидетельство о рождении и паспорт представителя","б":"Ребёнок может прийти сам со свидетельством о рождении","в":"Достаточно любого взрослого сопровождающего","г":"Родитель по видеосвязи, без документов"}, k:"а", e:"До 15 лет согласие даёт законный представитель. Бабушка, тётя или няня — только с доверенностью по утверждённой форме."},
  {id:"4.3", t:"Пациентка по телефону: «Отдайте мой рецепт водителю, он скажет фамилию».", o:{"а":"Отдать, если водитель назовёт фамилию","б":"Отправить фото рецепта в мессенджер","в":"Отдать любому, кто знает дату приёма","г":"Выдать только лично или по письменному разрешению пациентки по утверждённой форме"}, k:"г", e:"Документы третьим лицам — только по письменному разрешению."},
  {id:"4.4", t:"Мужчина: «Моя жена была у вас вчера? Что ей назначили?»", o:{"а":"Сверить с МИС и подтвердить визит, но не говорить о назначениях","б":"Передать трубку врачу","в":"«Я не могу подтвердить или обсудить обращение другого человека. Если вас что-то беспокоит, расскажите — я передам врачу»","г":"Попросить назвать дату рождения жены и тогда ответить"}, k:"в", e:"Даже факт визита не подтверждаем. Информацию от родственника принимаем."},
  {id:"4.5", train:true, t:"«У вас анонимно?» Какой ответ допустим до заключения юриста?", o:{"а":"«Да, вся информация остаётся в нашей базе и никуда не передаётся»","б":"«Можно без паспорта под любым именем, и рецепт тоже выпишем»","в":"«Всё, что вы расскажете врачу, — врачебная тайна. Без вашего согласия мы не сообщаем об обращении ни родственникам, ни работодателю. Если важно прийти анонимно, расскажу, как это оформить и какие есть ограничения»","г":"«Вы подпишете отказ от передачи данных в департамент здравоохранения»"}, k:"в", e:"Учебный вопрос. «а», «б», «г» — обещания, которые клиника может не выполнить. Окончательная формулировка — после заключения юриста."}
 ]},
 {id:"p5", short:"Следующий шаг", title:"Часть 5. Следующий шаг", note:"", type:"mcq", qs:[
  {id:"5.1", t:"Пациент после цены и времени: «Я подумаю». Лучший ответ:", o:{"а":"«Хорошо, будем ждать вашего звонка»","б":"«Места быстро заканчиваются, лучше записаться сейчас»","в":"«Конечно. Могу придержать за вами это время до вечера и прислать профиль врача. Как вам удобнее?»","г":"«Вы можете сами выбрать время на сайте»"}, k:"в", e:"«б» — давление, «г» — пациент уходит с линии, «а» — нет следующего шага."},
  {id:"5.2", t:"Пациент: «Нет, спасибо, ничего не бронируйте и не присылайте. Если надумаю — позвоню сам». Ваш ответ?", o:{"а":"«Понимаю. Если решите — звоните по этому номеру, подберём удобное время. Всего доброго»","б":"«Давайте я всё-таки пришлю профиль врача, это ни к чему не обязывает»","в":"«Тогда я перезвоню вам завтра, вдруг передумаете»","г":"«Жаль, у этого врача потом может не быть мест на месяц вперёд»"}, k:"а", e:"Отказ от контакта уважаем: без повторных предложений, перезвонов и запугивания нехваткой мест. Исключение — если в разговоре прозвучал сигнал стоп-блока."},
  {id:"5.3", t:"Врач отменил приём за 2 дня, пациентка уже купила билеты в Москву. Первая фраза:", o:{"а":"«Я администратор, могу только передать вам номер директора»","б":"«Извините, пожалуйста, это наша ситуация. Хочу предложить варианты, чтобы ваша поездка не пропала»","в":"«У врача семейные обстоятельства, ничего не поделаешь»","г":"Ничего не говорить: пациентке уже отправлено SMS"}, k:"б", e:"Извинение от имени клиники и варианты сразу."},
  {id:"5.4", t:"Пациентка на лечении: «Состояние стабильное. Хочу спросить врача, переходить ли на второй препарат».", o:{"а":"Записать вопрос дословно, спросить канал ответа, назвать срок, передать врачу, ответ передать дословно","б":"Посоветовать пока ничего не менять","в":"Сказать, что врач отвечает только на приёме","г":"Посмотреть назначения в карте и ответить самостоятельно"}, k:"а", e:"Образец — звонок #333. «б» и «г» — совет по лечению."},
  {id:"5.5", t:"Вы пообещали пациенту ответ до 16:30. В 16:30 врач ещё не ответил. Ваши действия?", o:{"а":"Ждать ответа врача, потом перезвонить","б":"Устно передать следующей смене","в":"Ничего: пациент перезвонит сам","г":"Связаться с пациентом: «Врач ещё на приёме, отвечу вам до [время]» — и обновить срок в CRM"}, k:"г", e:"Обещанный срок соблюдается, даже если ответа ещё нет."}
 ]},
 {id:"p6", short:"Ценности", title:"Часть 6. Ценности и позиционирование Бенедикт", note:"Главный смысл: мы собрали сильных врачей в одну команду, чтобы пациенту была доступна согласованная и безопасная помощь даже в сложной ситуации.", type:"mcq", qs:[
  {id:"6.1", t:"Как одной фразой объяснить, чем Бенедикт отличается?", o:{"а":"«У нас лучшие врачи Москвы»","б":"«У нас работает команда сильных врачей доказательной медицины: при сложной ситуации ваш врач может привлечь коллег, и вам не придётся искать специалистов самостоятельно»","в":"«Мы лечим любые психические расстройства»","г":"«У нас дороже, потому что качественнее»"}, k:"б", e:"Ценность — команда и согласованная помощь, а не превосходные степени."},
  {id:"6.2", t:"Когда уместна короткая презентация клиники (20–30 секунд)?", o:{"а":"В начале каждого звонка, до вопросов пациента","б":"Никогда: пациенту это неинтересно","в":"После того как понятны запрос и подходящий врач — как аргумент перед предложением даты; в срочной ситуации — не уместна","г":"Только если пациент просит скидку"}, k:"в", e:"Порядок: потребность → подходящий врач → преимущество команды → конкретная дата. Длинные монологи — частая ошибка в реальных звонках."},
  {id:"6.3", t:"«Почему мне стоит обратиться именно к вам?» Какой ответ допустим?", o:{"а":"«Потому что у нас вас точно вылечат»","б":"«У нас дешевле, чем в других премиальных клиниках»","в":"«В других клиниках часто лечат неправильно»","г":"«Мы очень внимательно выбираем врачей: в команде 23 врача из топ-100 Москвы и известный психофармаколог Сергей Сергеевич Потанин. Если ситуация окажется сложнее, поможем подобрать дополнительную экспертизу внутри команды»"}, k:"г", e:"Сильные аргументы — команда, топ-100, известный психофармаколог — без гарантий результата и без критики коллег."},
  {id:"6.4", t:"Пациентка: «Боюсь ошибиться с выбором врача». Ваш ответ?", o:{"а":"«Посмотрите отзывы на сайте и выберите сами»","б":"«Вам не нужно разбираться во всех специализациях. Расскажите, что сейчас важнее всего, — я помогу подобрать врача. Если понадобится другой профиль, врач порекомендует коллегу из нашей команды»","в":"«Все врачи у нас одинаково хорошие, берите любого»","г":"«Если не подойдёт — вернём деньги»"}, k:"б", e:"Снимаем страх ошибки через подбор и командную преемственность, а не через гарантии."},
  {id:"6.5", t:"Какое обещание о командной работе администратор может дать?", o:{"а":"«Ваш случай обязательно разберёт консилиум»","б":"«Благодаря команде мы гарантируем результат»","в":"«При необходимости врач может обсудить ваш случай с коллегами и предложить консультацию другого специалиста клиники»","г":"«Психофармаколог посмотрит ваши назначения бесплатно»"}, k:"в", e:"Обещаем возможность, а не автоматическую процедуру или результат. Привлечение коллег — по решению врача и с согласия пациента."},
  {id:"6.6", t:"Какой набор точнее всего отражает ценности Бенедикт?", o:{"а":"Скорость записи, низкая цена, широкий охват","б":"Безопасность пациента, доказательная медицина, команда, ответственность, уважение и конфиденциальность, преемственность лечения","в":"Престиж, эксклюзивность, известные имена","г":"Индивидуальный подход и гарантия результата"}, k:"б", e:"Каждая ценность — это действие администратора: стоп-блок, отказ от диагнозов, подбор в команде, соблюдение сроков, врачебная тайна, контроль рецептов и переносов."}
 ]},
 {id:"p7", short:"7 этапов", title:"Часть 7. Стандарт первого контакта", note:"Формула Benedict: услышать → понять → проверить безопасность → признать потребность → предложить решение → согласовать действие → подтвердить → выполнить.", type:"mcq", qs:[
  {id:"7.1", t:"Какой порядок соответствует формуле Benedict?", o:{"а":"Цена → врач → запись → вопросы пациента","б":"Услышать → понять → проверить безопасность → признать потребность → предложить решение → согласовать действие → подтвердить → выполнить","в":"Анкета → диагноз → подбор врача → запись","г":"Предложить свободное время → выслушать → назвать цену"}, k:"б", e:"Сначала человек и его запрос, затем решение и согласованный шаг. При признаках опасности обычный сценарий прерывается."},
  {id:"7.2", t:"Этап 1. Как начать разговор?", o:{"а":"«Клиника Бенедикт, администратор [имя]. Здравствуйте! Как я могу к вам обращаться и чем могу помочь?» — и дать человеку первым сформулировать причину обращения","б":"Сразу задать вопросы анкеты: возраст, первичный или повторный, к какому врачу","в":"Назвать ближайшие свободные окна","г":"Рассказать о клинике и команде врачей"}, k:"а", e:"Задача этапа 1 — выслушать основной запрос, не перебивая и не начиная с анкеты."},
  {id:"7.3", t:"Этап 3. Какая фраза показывает, что человека услышали?", o:{"а":"«Не переживайте, всё будет хорошо»","б":"«Мы точно вам поможем»","в":"«Понимаю, что эта ситуация вас беспокоит»","г":"«Это у многих бывает, ничего страшного»"}, k:"в", e:"Признаём потребность, не обесцениваем и не даём формальных заверений."},
  {id:"7.4", t:"Этап 4. Пациенту важно, почему предложен именно этот врач. Что говорите?", o:{"а":"Не более 2–3 проверенных фактов: специализация по запросу, опыт с этой возрастной группой, формат консультации","б":"«Это лучший врач, он точно вылечит»","в":"Полный список регалий и публикаций врача","г":"«Он обязательно поставит диагноз за один приём»"}, k:"а", e:"Объясняем выбор фактами, без гарантий результата и превосходных обещаний."},

];
PARTS.forEach(p=>p.qs.forEach(q=>{ q.key=q.id.replace(".","_"); }));

const SIMS = [
 {id:"C1", t:"С1. Реакция на препарат", crit:true, items:["Остановил обычный сценарий и спросил, как пациент прямо сейчас","При признаках опасности сейчас — 103 немедленно; иначе предупредил о 103 при ухудшении","Не дал совета про приём препарата","Позвонил врачу голосом, передал сводку по SBAR","Получил подтверждение, назвал звонящему точное время связи","Записал событие в журнал красных флагов"]},
 {id:"C2", t:"С2. Подросток, безнадёжность", crit:true, items:["Задал вопрос о безопасности до ответа про цену","Ответ «не знаю» воспринял как сигнал: маршрут Б","Не назвал диагноз и не пообещал «пройдёт»","Дал инструкцию: при ухудшении — звонить, при угрозе — 103","Не пообещал ни тайну от мамы, ни что маме всё расскажут","Цену и формат назвал после маршрутизации"]},
 {id:"C3", t:"С3. Инсульт под видом записи", crit:true, items:["Не стал записывать и сразу направил в 103","Уточнил, есть ли кто-то рядом; если нет — узнал адрес и вызвал сам","Сообщил дежурному врачу и записал в журнал"]},

 {id:"C6", t:"С6. Запрос родственника: зависимость и конфиденциальность", crit:false}
];
const CRITERIA = [["Распознавание срочности и маршрут",20],["Уважение и психологическая безопасность",20],["Точность понимания запроса",15],["Соответствие врача запросу",15],["Прозрачность цены и условий",10],["Согласованный следующий шаг",10],["Документирование и передача",10]];

const P1 = PARTS[0];
const P1_TOTAL = P1.qs.length;
const REST_MCQ = PARTS.filter(p=>p.type==="mcq" && p.id!=="p1").flatMap(p=>p.qs).filter(q=>!q.train);
const FREE = PARTS.find(p=>p.id==="p2").qs;
const REST_TOTAL = REST_MCQ.length + FREE.length;
const REST_PASS = Math.ceil(REST_TOTAL*0.9);
const ALL_Q = PARTS.flatMap(p=>p.qs);
const TOTAL_Q = ALL_Q.length;

// ---------- УТИЛИТЫ ----------
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else if(v!==false && v!=null) n.setAttribute(k,v);} for(const c of kids.flat()){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); } return n; };
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const LETTERS = ["а","б","в","г"];
const dd = d => !d ? null : (typeof d.data==="function" ? d.data() : (d.data && typeof d.data==="object" ? d.data : d));
const fmtDate = ts => new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const DKEY = "benedict-attest-v2.2";
const ls = { get(){ try{ return JSON.parse(localStorage.getItem(DKEY)||"null"); }catch(e){ return null; } }, set(v){ try{ localStorage.setItem(DKEY, JSON.stringify(v)); }catch(e){} }, del(){ try{ localStorage.removeItem(DKEY); }catch(e){} } };

let db=null, user=null, myId=null, isMgr=false;

// ---------- ПОДКЛЮЧЕНИЕ ----------

  if(MODE!=="web") return;
  try { user = await claude.use("user"); } catch(e){ user=null; }
  try { db = await claude.use("db"); } catch(e){ db=null; }
  try { if(user){ myId = await user.id(); isMgr = !!(user.isOwner() || user.canEdit()); } } catch(e){}
  if(isMgr) $("#tabs").classList.remove("hide");
  render();
}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ state.view=b.dataset.v; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); }));

      el("tr",{}, el("td",{},"Уровень 2. Клиническая маршрутизация"), el("td",{},"Три обязательных ролевых сценария с тренером: реакция на препарат, безнадёжность подростка, симптомы инсульта. Ни одной критической ошибки.")),
      el("tr",{}, el("td",{},"Уровень 3. Сервисная коммуникация"), el("td",{},"Три ролевых сценария: подбор врача, сомнения из-за цены, запрос родственника. Каждый — от 90 из 100.")),
      el("tr",{}, el("td",{},"Допуск к самостоятельной работе"), el("td",{},"После всех трёх уровней и утверждения руководителем.")))),

      : el("div",{}, el("p",{class:"notice"},"После теста нажмите «Скопировать результат» и отправьте его тренеру в Telegram."),

// ---------- ТЕСТ ----------
const isAnswered = (p,q) => p.type==="mcq" ? !!state.answers[q.key] : (state.free[q.key]||"").trim().length>5;
function answeredCount(){ let n=0; PARTS.forEach(p=>p.qs.forEach(q=>{ if(isAnswered(p,q)) n++; })); return n; }
function partDone(p){ return p.qs.every(q=>isAnswered(p,q)); }
function renderTest(app){
  const p = PARTS[state.step];
  const n = answeredCount();
  app.append(el("div",{class:"steps"}, PARTS.map((pp,i)=>el("button",{class:(i===state.step?"on ":"")+(partDone(pp)?"done":""),onclick:()=>{ state.step=i; saveDraft(); render(); window.scrollTo(0,0);} }, (i+1)+". "+pp.short))));
  app.append(el("div",{class:"row small mute",style:"justify-content:space-between"}, el("span",{id:"progtxt"},`Отвечено ${n} из ${TOTAL_Q}`), el("span",{},"Черновик сохраняется на этом устройстве")));
  app.append(el("div",{class:"bar"}, el("i",{id:"progbar",style:`width:${n/TOTAL_Q*100}%`})));
  app.append(el("h2",{},p.title));
  if(p.note) app.append(el("p",{class:"small mute"},p.note));
  p.qs.forEach(q=>{
    const card = el("div",{class:"card"}, el("div",{class:"q"}, q.id+". ", q.t, q.train? [" ", el("span",{class:"tag warn"},"учебный, вне зачёта")] : null));
    if(p.type==="mcq"){
      state.order[q.key].forEach((key,i)=>{
        const id="o_"+q.key+"_"+key;
        const lab = el("label",{class:"opt"+(state.answers[q.key]===key?" sel":""),for:id},
          el("input",{type:"radio",name:"q_"+q.key,id,value:key,checked:state.answers[q.key]===key?"checked":false,onchange:()=>{ state.answers[q.key]=key; card.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel")); lab.classList.add("sel"); updProg(); saveDraft(); }}),
          el("span",{}, LETTERS[i]+") "+q.o[key]));
        card.append(lab);
      });
    } else {
      const ta = el("textarea",{placeholder:"Что не так и как сказать правильно",oninput:e=>{ state.free[q.key]=e.target.value; updProg(); saveDraft(); }});
      ta.value = state.free[q.key]||"";
      card.append(ta);
    }
    app.append(card);
  });
  const err = el("p",{class:"notice hide",id:"err"},"");
  const last = state.step===PARTS.length-1;
  app.append(err, el("div",{class:"row",style:"justify-content:space-between"},
    el("div",{class:"row"}, state.step>0 ? el("button",{class:"btn ghost",onclick:()=>{ state.step--; saveDraft(); render(); window.scrollTo(0,0);} },"← Назад") : el("button",{class:"btn ghost",onclick:()=>{ state.stage="intro"; render(); }},"К описанию")),
    last ? el("button",{class:"btn",id:"submit",onclick:submit},"Завершить и отправить")
         : el("button",{class:"btn",onclick:()=>{ state.step++; saveDraft(); render(); window.scrollTo(0,0);} },"Далее →")));
}
function updProg(){ const n=answeredCount(); const t=$("#progtxt"); if(t) t.textContent=`Отвечено ${n} из ${TOTAL_Q}`; const b=$("#progbar"); if(b) b.style.width=(n/TOTAL_Q*100)+"%"; }

function score(answers){
  return { p1: P1.qs.filter(q=>answers[q.key]===q.k).length, auto: REST_MCQ.filter(q=>answers[q.key]===q.k).length };
}
function weighted(scores){ if(!scores) return 0; return Math.round(CRITERIA.reduce((s,[_,w],i)=> s + ((scores[i]||0)/3)*w, 0)); }
function simState(a, sm){
  const s=(a.sims||{})[sm.id];
  if(sm.crit){ if(!s||!s.items) return null; return s.items.length===sm.items.length && s.items.every(Boolean); }
  if(!s||!s.scores||s.scores.some(v=>v==null)) return null; return weighted(s.scores)>=90;
}
function levels(a){
  const graded = Object.keys(a.freeGrades||{}).length===FREE.length;
  const free = Object.values(a.freeGrades||{}).filter(v=>v===1).length;
  let L1;
  if(a.p1<P1_TOTAL) L1={v:false,txt:"Не сдан: стоп-блок"};
  else if(!graded) L1 = (a.auto+FREE.length<REST_PASS) ? {v:false,txt:"Не сдан: части 2–7"} : {v:null,txt:"Ждёт проверки части 2"};
  else L1 = (a.auto+free>=REST_PASS) ? {v:true,txt:`Сдан (${a.auto+free}/${REST_TOTAL})`} : {v:false,txt:`Не сдан: части 2–7 (${a.auto+free}/${REST_TOTAL})`};
  const lv = list => { const r=list.map(sm=>simState(a,sm)); if(r.some(x=>x===false)) return {v:false,txt:"Есть незачтённые сценарии"}; if(r.some(x=>x===null)) return {v:null,txt:`Оценено ${r.filter(x=>x!==null).length} из ${r.length}`}; return {v:true,txt:"Зачтено"}; };
  const L2 = lv(SIMS.filter(s=>s.crit)), L3 = lv(SIMS.filter(s=>!s.crit));
  let fin;
  if([L1,L2,L3].some(x=>x.v===false)) fin={cls:"bad",txt:"Не допущен"};
  else if([L1,L2,L3].every(x=>x.v===true)) fin = a.approved ? {cls:"ok",txt:"Допущен к работе"} : {cls:"warn",txt:"Ждёт утверждения руководителем"};
  else fin={cls:"warn",txt:"Аттестация не завершена"};
  return {L1,L2,L3,fin};
}

async function submit(){
  const n=answeredCount();
  if(n<TOTAL_Q){
    const firstOpen = PARTS.findIndex(p=>!partDone(p));
    const e=$("#err"); e.textContent=`Ответьте на все вопросы: осталось ${TOTAL_Q-n}. Первая незавершённая часть — ${firstOpen+1}.`; e.classList.remove("hide"); return;
  }
  const btn=$("#submit"); btn.disabled=true; btn.textContent="Сохраняю…";
  const s = score(state.answers);
  const attempt = { v:2, at: Date.now(), answers: {...state.answers}, free: {...state.free}, p1: s.p1, auto: s.auto, freeGrades: {}, sims: {}, approved:false };
  state.last = attempt; state.saved = false; state.saveErr=null;
  if(MODE==="web" && db && myId){
    try{
      const ref = db.doc("results/"+myId);
      const prev = dd(await ref.get());
      const attempts = (prev && Array.isArray(prev.attempts)) ? prev.attempts.slice() : [];
      attempts.push(attempt);
      await ref.set({ uid: myId, updatedAt: Date.now(), attempts });
      state.saved = true;
    }catch(e){ state.saveErr = String(e && e.message || e); }
  }
  ls.del();
  state.stage="done"; render(); window.scrollTo(0,0);
}

// ---------- РЕЗУЛЬТАТ ----------
function reportText(a){
  const L=[];
  L.push("АТТЕСТАЦИЯ АДМИНИСТРАТОРА · Бенедикт · уровень 1 (теория)");
  if(state.name) L.push("Сотрудник: "+state.name.trim());
  L.push("Дата: "+fmtDate(a.at));
  L.push(`Стоп-блок: ${a.p1}/${P1_TOTAL}`+(a.p1===P1_TOTAL?" (зачёт)":" (пересдача)"));
  L.push(`Части 3–7 с выбором: ${a.auto}/${REST_MCQ.length}`);
  const wrong=ALL_Q.filter(q=>q.o && a.answers[q.key]!==q.k).map(q=>q.id+(q.train?" (учебный)":""));
  L.push("Ошибки: "+(wrong.length?wrong.join(", "):"нет"));
  L.push(`Порог частей 2–7: ${REST_PASS}/${REST_TOTAL} после проверки части 2`);
  L.push("");
  L.push("Часть 2 (проверяет тренер):");
  FREE.forEach(q=>L.push(q.id+" "+(a.free[q.key]||"").trim()));
  return L.join("\n");
}
function reportBox(a){
  const txt=reportText(a);
  const ta=el("textarea",{readonly:"readonly",style:"min-height:160px;font-size:13px"}); ta.value=txt;
  const msg=el("span",{class:"small mute"},"");
  const copy=async()=>{ try{ await navigator.clipboard.writeText(txt); msg.textContent="Скопировано. Вставьте в чат с тренером."; }catch(e){ ta.focus(); ta.select(); try{ document.execCommand("copy"); msg.textContent="Скопировано. Вставьте в чат с тренером."; }catch(_){ msg.textContent="Выделите текст и скопируйте вручную."; } } };
  return el("div",{}, el("p",{class:"small mute",style:"margin-top:16px"},"Отправьте этот текст тренеру в Telegram:"), ta, el("div",{class:"row",style:"margin-top:10px"}, el("button",{class:"btn",onclick:copy},"Скопировать результат"), msg));
}
function renderDone(app){
  const a = state.last;
  app.append(el("div",{class:"card"},
    el("h2",{style:"margin-top:0;font-size:22px"},"Уровень 1 завершён"),
    el("table",{}, el("tbody",{},
      el("tr",{}, el("td",{},"Стоп-блок"), el("td",{}, `${a.p1} из ${P1_TOTAL}`), el("td",{}, a.p1===P1_TOTAL? el("span",{class:"tag ok"},"зачёт") : el("span",{class:"tag bad"},"пересдача через 3 дня"))),
      el("tr",{}, el("td",{},"Части 3–7 с выбором"), el("td",{}, `${a.auto} из ${REST_MCQ.length}`), el("td",{},"")),
      el("tr",{}, el("td",{},"Часть 2"), el("td",{}, "проверит тренер"), el("td",{},"")))),
    el("p",{class:"small mute"},`Порог частей 2–7 — ${REST_PASS} из ${REST_TOTAL}. Дальше — ролевые сценарии с тренером (уровни 2 и 3).`),
    MODE==="web"
      ? (state.saved ? el("p",{class:"small mute"},"Результат сохранён и виден руководителю.") : el("p",{class:"notice"}, db? "Не удалось сохранить результат"+(state.saveErr?": "+state.saveErr:"")+". Сообщите тренеру." : "Результат не сохранён: сохранение недоступно в этом просмотре. Покажите экран тренеру."))
      : reportBox(a)
  ));
  app.append(el("h2",{},"Разбор ошибок"));
  let wrong=0;
  ALL_Q.filter(q=>q.o).forEach(q=>{
    if(a.answers[q.key]===q.k) return; wrong++;
    app.append(el("div",{class:"card res-wrong"}, el("div",{class:"q"}, q.id+". ", q.t),
      el("div",{class:"small"}, "Ваш ответ: ", q.o[a.answers[q.key]]||"—"),
      el("div",{class:"small"}, el("b",{style:"font-weight:600"},"Верно: "), q.o[q.k]),
      el("div",{class:"expl"}, q.e)));
  });
  if(!wrong) app.append(el("p",{class:"mute"},"В вопросах с выбором ошибок нет."));
  app.append(el("div",{class:"row",style:"margin-top:16px"}, el("button",{class:"btn ghost",onclick:()=>{ state.stage="intro"; render(); }},"На главную")));
}

// ---------- РУКОВОДИТЕЛЬ ----------
let mgr = { rows:null, err:null, open:null, unsub:null, names:{} };
function loadMgr(){
  if(!db){ mgr.err="Хранилище недоступно в этом просмотре."; return; }
  if(mgr.unsub) return;
  const t=setTimeout(()=>{ if(mgr.rows===null){ mgr.err="Не удалось загрузить результаты за 10 секунд."; render(); } },10000);
  try{
    mgr.unsub = db.collection("results").onSnapshot(async snap=>{
      clearTimeout(t);
      const docs = (snap.docs||snap||[]).map(d=> ({ ...dd(d), id: d.id }));
      mgr.rows = docs; mgr.err=null;
      try{ const ids=docs.map(d=>d.uid||d.id); if(user && ids.length){ const ps=await user.profiles(ids); ids.forEach(id=>{ mgr.names[id]=(ps[id]&&ps[id].name)||""; }); } }catch(e){}
      if(state.view==="mgr" && !mgr.open) render();
    }, err=>{ clearTimeout(t); mgr.err=String(err&&err.message||err); if(state.view==="mgr") render(); });
  }catch(e){ clearTimeout(t); mgr.err=String(e&&e.message||e); }
}
function nameOf(uid){ return mgr.names[uid] || ("Сотрудник " + String(uid).slice(-4)); }
const tagFor = x => el("span",{class:"tag "+(x.v===true?"ok":x.v===false?"bad":"warn")}, x.txt);

function renderMgr(app){
  if(!isMgr){ app.append(el("p",{class:"notice"},"Раздел доступен только руководителю.")); return; }
  loadMgr();
  if(mgr.err){ app.append(el("p",{class:"notice"},mgr.err)); return; }
  if(mgr.rows===null){ app.append(el("p",{class:"mute"},"Загрузка результатов…")); return; }
  if(mgr.open) return renderAttempt(app);
  if(!mgr.rows.length){ app.append(el("div",{class:"card"}, el("p",{},"Пока никто не прошёл тест."), el("p",{class:"small mute"},"Поделитесь страницей с администраторами с правом «Contributor»: иначе их результаты не сохранятся."))); return; }
  const tb = el("tbody");
  mgr.rows.forEach(r=> (r.attempts||[]).forEach((a,i)=>{
    if(a.v!==2) return;
    const L=levels(a);
    tb.append(el("tr",{},
      el("td",{}, nameOf(r.uid||r.id)), el("td",{class:"small"}, fmtDate(a.at)),
      el("td",{}, tagFor(L.L1)), el("td",{}, tagFor(L.L2)), el("td",{}, tagFor(L.L3)),
      el("td",{}, el("span",{class:"tag "+L.fin.cls}, L.fin.txt)),
      el("td",{}, el("button",{class:"btn ghost",style:"padding:6px 12px",onclick:()=>{ mgr.open={doc:r.id, idx:i}; render(); window.scrollTo(0,0);} },"Открыть"))));
  }));
  app.append(el("div",{class:"card",style:"overflow-x:auto"}, el("table",{}, el("thead",{}, el("tr",{}, ...["Сотрудник","Дата","Ур. 1 Теория","Ур. 2 Клиника","Ур. 3 Сервис","Итог",""].map(h=>el("th",{},h)))), tb)));
  app.append(el("p",{class:"small mute"},"Показаны попытки версии 2. Администраторам нужна ссылка на страницу с правом «Contributor»."));
}

function renderAttempt(app){
  const r = mgr.rows.find(x=>x.id===mgr.open.doc); if(!r){ mgr.open=null; return render(); }
  const a = JSON.parse(JSON.stringify(r.attempts[mgr.open.idx]));
  a.freeGrades = a.freeGrades||{}; a.sims = a.sims||{};
  app.append(el("div",{class:"row"}, el("button",{class:"btn ghost",onclick:()=>{ mgr.open=null; render(); }},"← Ко всем результатам")));
  app.append(el("h2",{}, nameOf(r.uid||r.id), " · ", fmtDate(a.at)));
  const stBox = el("div",{class:"card"});
  const setSt=()=>{ stBox.innerHTML=""; const L=levels(a);
    stBox.append(el("table",{class:"levels"}, el("tbody",{},
      el("tr",{}, el("td",{},"Уровень 1. Теория"), el("td",{}, tagFor(L.L1), el("div",{class:"small mute"},`стоп-блок ${a.p1}/${P1_TOTAL} · с выбором ${a.auto}/${REST_MCQ.length}`))),
      el("tr",{}, el("td",{},"Уровень 2. Клиническая маршрутизация"), el("td",{}, tagFor(L.L2))),
      el("tr",{}, el("td",{},"Уровень 3. Сервисная коммуникация"), el("td",{}, tagFor(L.L3))),
      el("tr",{}, el("td",{},"Итог"), el("td",{}, el("span",{class:"tag "+L.fin.cls}, L.fin.txt))))));
    const ready = [L.L1,L.L2,L.L3].every(x=>x.v===true);
    const cb = el("input",{type:"checkbox",checked:a.approved?"checked":false,disabled:ready?false:"disabled",onchange:e=>{ a.approved=e.target.checked; setSt(); }});
    stBox.append(el("label",{class:"opt",style:"margin-top:12px"}, cb, el("span",{}, "Утверждаю допуск к самостоятельной работе", ready?"":el("span",{class:"small mute"}," — доступно после всех трёх уровней"))));
  }; setSt();
  app.append(stBox);

  app.append(el("h3",{},"Часть 2 — оценка тренера"));
  FREE.forEach(q=>{
    const sel = el("select",{onchange:e=>{ if(e.target.value==="") delete a.freeGrades[q.key]; else a.freeGrades[q.key]=+e.target.value; setSt(); }},
      el("option",{value:""},"—"), el("option",{value:"1"},"Зачтено"), el("option",{value:"0"},"Не зачтено"));
    sel.value = a.freeGrades[q.key]===undefined ? "" : String(a.freeGrades[q.key]);
    app.append(el("div",{class:"card"}, el("div",{class:"q"}, q.id+". ", q.t),
      el("div",{}, el("b",{style:"font-weight:600"},"Ответ: "), a.free[q.key]||"—"),
      el("div",{class:"expl"}, "Эталон: ", q.k),
      el("div",{class:"row",style:"margin-top:8px"}, sel)));
  });

  app.append(el("h3",{},"Ошибки в вопросах с выбором"));
  let w=0;
  ALL_Q.filter(q=>q.o).forEach(q=>{ if(a.answers[q.key]===q.k) return; w++;
    app.append(el("div",{class:"card res-wrong small"}, el("b",{style:"font-weight:600"},q.id+". "), q.t, q.train?" (учебный)":"", el("div",{},"Ответ: ", q.o[a.answers[q.key]]||"—"), el("div",{},"Верно: ", q.o[q.k]))); });
  if(!w) app.append(el("p",{class:"mute"},"Ошибок нет."));

  const simBlock = (title, list) => {
    app.append(el("h3",{},title));
    list.forEach(sm=>{
      const box = el("div",{class:"card"}, el("div",{class:"q"}, sm.t, " ", el("span",{class:"tag "+(sm.crit?"bad":"")}, sm.crit?"все действия обязательны":"зачёт от 90 баллов")));
      const cur = a.sims[sm.id];
      if(sm.crit){
        const items = (cur&&cur.items)||sm.items.map(()=>false);
        sm.items.forEach((t,i)=>{ const cb=el("input",{type:"checkbox",checked:items[i]?"checked":false,onchange:e=>{ items[i]=e.target.checked; a.sims[sm.id]={items:items.slice()}; setSt(); }}); box.append(el("label",{class:"opt"}, cb, el("span",{},t))); });
      } else {
        const scores = (cur&&cur.scores)||CRITERIA.map(()=>null);
        const tot = el("div",{class:"small mute",style:"margin-top:6px"},"");
        const upd=()=>{ tot.textContent = scores.every(v=>v!=null) ? `Итог: ${weighted(scores)} из 100` : "Оцените все критерии"; };
        CRITERIA.forEach(([c,wgt],i)=>{
          const s=el("select",{onchange:e=>{ scores[i]= e.target.value===""? null : +e.target.value; a.sims[sm.id]={scores:scores.slice()}; upd(); setSt(); }}, el("option",{value:""},"—"), ...[0,1,2,3].map(v=>el("option",{value:String(v)},String(v))));
          s.value = scores[i]==null? "" : String(scores[i]);
          box.append(el("div",{class:"row",style:"justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"}, el("span",{class:"small"}, `${c} (вес ${wgt})`), s));
        });
        upd(); box.append(tot);
      }
      app.append(box);
    });
  };
  simBlock("Уровень 2. Клинические сценарии", SIMS.filter(s=>s.crit));
  simBlock("Уровень 3. Сервисные сценарии", SIMS.filter(s=>!s.crit));

  const msg = el("p",{class:"small mute"},"");
  app.append(el("div",{class:"row"}, el("button",{class:"btn",onclick:async(e)=>{
    e.target.disabled=true; msg.textContent="Сохраняю…";
    try{
      const ref=db.doc("results/"+r.id); const cur=dd(await ref.get())||{}; delete cur.id;
      const attempts=(cur.attempts||[]).slice(); attempts[mgr.open.idx]=a;
      await ref.set({...cur, attempts, updatedAt:Date.now()});
      msg.textContent="Оценка сохранена.";
    }catch(err){ msg.textContent="Не удалось сохранить: "+(err&&err.message||err); }
    e.target.disabled=false;
  }},"Сохранить оценку"), msg));
}

boot();
</script>
